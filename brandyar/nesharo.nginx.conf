server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nesharo.ir www.nesharo.ir 62.60.194.9;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/brandyar-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://nesharo.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nesharo.ir;

    ssl_certificate /etc/letsencrypt/live/nesharo.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nesharo.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        proxy_send_timeout 15s;
    }
}
