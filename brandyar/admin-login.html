<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود امن مدیران | نشارو</title><link rel="stylesheet" href="/admin/workspace.css"><script src="/admin/workspace.js" defer></script><link rel="stylesheet" href="/design.css"></head><body class="admin-mode login-body"><main class="login-panel"><a class="brand" href="/"><span class="brand-mark">نـ</span><span>نشارو<small>فضای امن مدیران</small></span></a><h1>ورود به میز مدیریت</h1><p>این بخش مخصوص اعضای مجاز تیم است. ورود با رمز عبور و تأیید دومرحله‌ای انجام می‌شود.</p><form id="login-form"><label>ایمیل کاری<input name="email" type="email" dir="ltr" autocomplete="username" required maxlength="254"></label><label>رمز عبور<input name="password" type="password" dir="ltr" autocomplete="current-password" required maxlength="1024"></label><button type="submit">ادامه و تأیید هویت</button></form><form id="mfa-form" hidden><label>کد شش‌رقمی برنامهٔ تأیید هویت<input name="code" inputmode="numeric" autocomplete="one-time-code" dir="ltr" maxlength="6" required></label><button type="submit">ورود امن</button></form><p id="feedback" role="status" aria-live="polite"></p><a class="minor" href="/">بازگشت به سایت</a></main></body></html>
